    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.88);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --border-color: #334155;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        #app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Map Container */
        #map {
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            z-index: 1;
        }

        /* Coordinates Bar */
        .coords-bar {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 1000;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--bg-card-border);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            box-shadow: var(--shadow-lg);
        }

        /* Popup customization */
        .leaflet-popup-content-wrapper {
            background: var(--bg-secondary) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow-lg) !important;
        }

        .leaflet-popup-tip {
            background: var(--bg-secondary) !important;
        }

        .popup-title {
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .popup-table {
            width: 100%;
            font-size: 0.8rem;
        }

        .popup-table td {
            padding: 4px 6px;
        }

        .popup-table td.key {
            color: var(--text-secondary);
            font-weight: 600;
        }
    </style>
</head>

        // Basemap definitions
        const satelliteBasemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        const osmBasemap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Initialize Map (Esri Satellite by default)
        const map = L.map('map', {
            zoomControl: true,
            layers: [satelliteBasemap]
        }).fitBounds(initialBbox);

        // Layer Controls
        const baseMaps = {
            "Satellite": satelliteBasemap,
            "OpenStreetMap": osmBasemap
        };

        const overlayMaps = {};

        // Color palette for shapefiles
        const colorPalette = [
            "#38bdf8", "#f43f5e", "#10b981", "#fbbf24", "#a855f7", "#ec4899", "#06b6d4"
        ];

        // Track layers & opacity
        const allGeoJsonLayers = [];
        let currentOpacity = 0.0;

        // Process Layers
        layersData.forEach((ldata, index) => {
            const layerColor = colorPalette[index % colorPalette.length];
            const displayName = (ldata.layer_name || ldata.file_name).replace(/\.shp$/i, '');
            
            // Create Leaflet GeoJSON layer
            const geoJsonLayer = L.geoJSON(ldata.geojson, {
                style: function(feature) {
                    return {
                        color: layerColor,
                        weight: 2.5,
                        opacity: 0.9,
                        fillColor: layerColor,
                        fillOpacity: currentOpacity
                    };
                },
                onEachFeature: function(feature, layer) {
                    // Popup Content
                    if (feature.properties) {
                        let popHtml = `<div class="popup-title"><i class="fa-solid fa-draw-polygon"></i> ${displayName}</div>`;
                        popHtml += `<table class="popup-table">`;
                        for (let k in feature.properties) {
                            popHtml += `<tr><td class="key">${k}:</td><td>${feature.properties[k] !== null ? feature.properties[k] : 'N/A'}</td></tr>`;
                        }
                        popHtml += `</table>`;
                        layer.bindPopup(popHtml);
                    }
                }
            }).addTo(map);

            allGeoJsonLayers.push(geoJsonLayer);
            overlayMaps[`<span style="color:${layerColor};">■</span> ${displayName}`] = geoJsonLayer;
        });

        // Add Layer Control widget to top right
        const layerControlWidget = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // Inject Opacity Slider inside the Layer Control box
        const layerControlContainer = document.querySelector('.leaflet-control-layers-list');
        if (layerControlContainer) {
            const opacityDiv = document.createElement('div');
            opacityDiv.style.cssText = 'margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); font-size: 0.8rem;';
            opacityDiv.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px; font-weight:600; color:#38bdf8;">
                    <span><i class="fa-solid fa-circle-half-stroke"></i> Fill Opacity</span>
                    <span id="opacityValue">0%</span>
                </div>
                <input type="range" id="opacityRange" min="0" max="100" value="0" style="width:100%; cursor:pointer; accent-color:#38bdf8;" oninput="changeOpacity(this.value)">
            `;
            layerControlContainer.appendChild(opacityDiv);
        }

        // Opacity Change Handler
        function changeOpacity(val) {
            const opacity = parseFloat(val) / 100;
            document.getElementById('opacityValue').innerText = val + '%';
            currentOpacity = opacity;
            allGeoJsonLayers.forEach(layer => {
                layer.setStyle({
                    fillOpacity: opacity
                });
            });
        }

        // Track cursor coordinates
        map.on('mousemove', function(e) {
            document.getElementById('coordsBar').innerText = 
                `Lat: ${e.latlng.lat.toFixed(5)} | Lon: ${e.latlng.lng.toFixed(5)} | Zoom: ${map.getZoom()}`;
        });
    </script>
